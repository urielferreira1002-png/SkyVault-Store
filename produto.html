<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produto | SkyVault</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
  --preto:#000;
  --card:#0a0a0a;
  --dourado:#c5a059;
  --grad:linear-gradient(135deg,#c5a059 0%,#f1d39b 50%,#b38b45 100%);
  --branco:#fff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Arial;}
body{background:var(--preto);color:var(--branco);}

.header{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 6%;
  background:#000;border-bottom:1px solid #1a1a1a;
}
.logo{
  color:var(--dourado);
  font-weight:900;
  letter-spacing:4px;
  text-decoration:none;
  text-transform:uppercase;
}
.right{display:flex;gap:16px;align-items:center;}
.back{
  color:var(--dourado);
  border:1px solid var(--dourado);
  padding:6px 12px;
  border-radius:4px;
  text-decoration:none;
}
.userPhoto{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--dourado);
  object-fit:cover;display:none;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:70px 6% 90px;
  display:grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap:50px;
}

.card{
  background:var(--card);
  border:1px solid #1a1a1a;
  padding:28px;
}

.imgBox{
  height:500px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.imgBox img{
  width:100%;
  max-width:550px;
  filter: drop-shadow(0 30px 70px rgba(0,0,0,.5));
}

.badge{
  display:inline-block;
  background:var(--dourado);
  color:#000;
  font-weight:900;
  font-size:.7rem;
  padding:6px 14px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:14px;
}

h1{font-size:2.2rem;margin-bottom:10px;}

.desc{
  color:#bbb;
  line-height:1.6;
  margin:16px 0 24px;
}

.price{
  color:var(--dourado);
  font-size:2rem;
  font-weight:900;
  margin-bottom:18px;
}

.btn{
  width:100%;
  background:var(--grad);
  color:#000;
  border:none;
  padding:16px 18px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:4px;
}

.btn2{
  width:100%;
  margin-top:12px;
  background:transparent;
  color:var(--dourado);
  border:1px solid var(--dourado);
  padding:14px 18px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:2px;
  cursor:pointer;
  border-radius:4px;
}

.note{
  margin-top:14px;
  color:#888;
  font-size:.9rem;
}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr;}
  .imgBox{height:380px;}
}
</style>
</head>

<body>

<header class="header">
  <a class="logo" href="home.html">SkyVault</a>
  <div class="right">
    <a class="back" href="javascript:history.back()">
      <i class="fas fa-arrow-left"></i>
    </a>
    <img id="userPhoto" class="userPhoto" alt="Perfil">
  </div>
</header>

<main class="wrap">

  <section class="card">
    <div class="imgBox">
      <img id="pImg" src="mente.png" alt="Produto">
    </div>
  </section>

  <section class="card">
    <div id="pBadge" class="badge" style="display:none;"></div>

    <h1 id="pName">Mentalidade Blindada: Sua Primeira Renda Online</h1>

    <div class="price" id="pPrice">R$ 20,00</div>

    <p class="desc" id="pDesc">
      Descubra como desenvolver disciplina, foco e estratégia para construir sua primeira renda online de forma prática e estruturada.
    </p>

    <button class="btn" id="buyBtn">Comprar</button>
    <button class="btn2" id="saveBtn">Salvar na conta</button>

    <p class="note">
      Após pagar, envie o comprovante no WhatsApp para liberar seu acesso.
    </p>

  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAeQhnhf70Rl8pVXIczFHi6dTrmhBQkGGg",
  authDomain:"fitblue-7beef.firebaseapp.com",
  projectId:"fitblue-7beef",
  storageBucket:"fitblue-7beef.firebasestorage.app",
  messagingSenderId:"389213135420",
  appId:"1:389213135420:web:7c1170b9bb709df89f1939"
};

firebase.initializeApp(firebaseConfig);

// Foto Google
firebase.auth().onAuthStateChanged((user)=>{
  if(user?.photoURL){
    const img = document.getElementById("userPhoto");
    img.src = user.photoURL;
    img.style.display = "block";
  }
});

// BOTÃO NUBANK
document.getElementById("buyBtn").onclick = () => {
  window.location.href =
    "https://nubank.com.br/cobrar/4c5sze/69984e55-24ed-4add-8896-20f942048f0e";
};
</script>

</body>
</html>
