<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyVault | Coleção Premium</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{
--preto:#000;
--card:#0a0a0a;
--dourado:#c5a059;
--grad:linear-gradient(135deg,#c5a059 0%,#f1d39b 50%,#b38b45 100%);
--branco:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif;}
body{background:#000;color:#fff;}

.main-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 6%;
border-bottom:1px solid #1a1a1a;
}

.logo{
color:var(--dourado);
font-weight:900;
letter-spacing:4px;
text-decoration:none;
text-transform:uppercase;
}

.collection-header{
text-align:center;
padding:80px 20px 50px;
}

.collection-header h2{
font-size:3rem;
letter-spacing:4px;
margin-bottom:10px;
}

.collection-header p{
color:var(--dourado);
letter-spacing:3px;
font-size:.9rem;
}

.filter-bar{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:50px;
}

.filter-btn{
padding:10px 20px;
border:1px solid var(--dourado);
background:transparent;
color:var(--dourado);
cursor:pointer;
font-weight:600;
}

.filter-btn.active,
.filter-btn:hover{
background:var(--grad);
color:#000;
border-color:transparent;
}

.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:40px;
padding:0 8% 100px;
max-width:1400px;
margin:auto;
}

.product-card{
background:var(--card);
border:1px solid #1a1a1a;
padding:30px;
text-align:center;
transition:.4s;
position:relative;
}

.product-card:hover{
border-color:var(--dourado);
transform:translateY(-8px);
box-shadow:0 20px 50px rgba(197,160,89,.2);
}

.badge{
position:absolute;
top:20px;
right:20px;
background:var(--grad);
color:#000;
padding:5px 12px;
font-size:.7rem;
font-weight:800;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.product-image{
height:250px;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:20px;
}

.product-image img{
max-width:85%;
filter:drop-shadow(0 15px 30px rgba(0,0,0,.6));
transition:.4s;
}

.product-card:hover img{transform:scale(1.06);}

.product-price{
color:var(--dourado);
font-size:1.8rem;
font-weight:800;
margin:15px 0;
}

.btn-action{
display:block;
padding:14px;
background:transparent;
border:1px solid var(--dourado);
color:var(--dourado);
text-decoration:none;
font-weight:800;
letter-spacing:2px;
transition:.3s;
}

.product-card:hover .btn-action{
background:var(--grad);
color:#000;
border-color:transparent;
}

.empty-state{
text-align:center;
color:#aaa;
padding:40px 20px;
grid-column:1/-1;
border:1px dashed #222;
border-radius:8px;
}
</style>
</head>

<body>

<header class="main-header">
<a href="#" class="logo">SkyVault</a>
</header>

<div class="collection-header">
<h2>Coleção Premium</h2>
<p>Curadoria Exclusiva 2026</p>
</div>

<div class="filter-bar">
<button class="filter-btn active">Todos</button>
<button class="filter-btn">Ebooks</button>
<button class="filter-btn">Packs</button>
</div>

<section class="product-grid" id="productGrid">
<div class="empty-state">Carregando produtos...</div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyAeQhnhf70Rl8pVXIczFHi6dTrmhBQkGGg",
authDomain:"fitblue-7beef.firebaseapp.com",
projectId:"fitblue-7beef",
storageBucket:"fitblue-7beef.firebasestorage.app",
messagingSenderId:"389213135420",
appId:"1:389213135420:web:7c1170b9bb709df89f1939"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allProducts=[];

async function loadProducts(){
const grid=document.getElementById("productGrid");
grid.innerHTML="Testando conexão...";
allProducts=[];

try{
const snap=await db.collection("products").get();

console.log("Quantidade encontrada:", snap.size);

if(snap.empty){
grid.innerHTML="A coleção está vazia.";
return;
}

snap.forEach(doc=>{
console.log("Produto:", doc.id, doc.data());
});

grid.innerHTML="Coleção encontrada. Veja o console (F12).";

}catch(error){
console.error("ERRO FIREBASE:", error);
grid.innerHTML="Erro ao conectar. Veja o console.";
}
}
renderProducts(allProducts);

}catch(error){
console.error(error);
grid.innerHTML="<div class='empty-state'>Erro ao carregar produtos. Veja o console.</div>";
}
}

function renderProducts(products){
const grid=document.getElementById("productGrid");
grid.innerHTML="";

if(products.length === 0){
grid.innerHTML="<div class='empty-state'>Nenhum produto ativo.</div>";
return;
}

products.sort((a,b)=>a.price-b.price);

products.forEach(p=>{
const card=document.createElement("div");
card.className="product-card";

card.innerHTML=`
${p.badge?`<div class="badge">${p.badge}</div>`:""}
<div class="product-image">
<img src="${p.image}" alt="${p.name}">
</div>
<h3>${p.name}</h3>
<div class="product-price">R$ ${p.price.toFixed(2).replace(".",",")}</div>
<a href="produto.html?id=${p.id}" class="btn-action">Ver Produto</a>
`;

grid.appendChild(card);
});
}

function filterCategory(event,cat){
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
event.target.classList.add("active");

if(cat==="all"){
renderProducts(allProducts);
}else{
const filtered=allProducts.filter(p=>p.category===cat);
renderProducts(filtered);
}
}

loadProducts();
</script>

</body>
</html>
